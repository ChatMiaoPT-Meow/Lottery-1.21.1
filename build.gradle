plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Headless server-side tests (run with ./gradlew runGameTestServer). Not packaged into the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Visual check: opens run/saves/lottery-demo, walks through every GUI (ScreenshotDemo) and saves
        // screenshots to run/screenshots, then quits. Copy any world to saves/lottery-demo first.
        demoClient {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'lottery.demo', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'lottery-demo'
        }
        // Same as demoClient but records one frame per tick of the gacha / case / scratch animations
        // (run/screenshots/rec_*) for an animated preview.
        recordClient {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'lottery.record', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'lottery-demo'
        }
        gameTestServer {
            type = 'gameTestServer'
            // own directory so test ticket types never end up in the dev world's ledger (run/world)
            gameDirectory = project.file('run-gametest')
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def modProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

processResources {
    inputs.properties(modProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modProps
    }
}
